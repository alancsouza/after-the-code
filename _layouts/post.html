---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{% include data.html date=page.date %}</time></p>
  </header>
  {% if page.image %}
  <figure class="post-cover">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
  </figure>
  {% endif %}
  <div class="post-body">
    {{ content }}
  </div>
</article>
<nav class="back"><a href="{{ '/' | relative_url }}">← Todos os textos</a></nav>
